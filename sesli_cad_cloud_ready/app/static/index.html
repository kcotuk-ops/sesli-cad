roposalPositions button{border:1px solid #94a3b8;background:#fff;border-radius:999px;padding:5px 8px;font-size:11px}.proposalPositions button.active{background:#dbeafe;border-color:#2563eb}.pickBadge{position:absolute;z-index:6;right:12px;bottom:95px;background:#111827dd;color:#fff;padding:8px 10px;border-radius:8px;font-size:11px;display:none}.drawer{display:none}.modalBg{position:fixed;inset:0;background:#0007;z-index:30;display:none;align-items:center;justify-content:center;padding:18px}.modal{background:#fff;width:min(440px,100%);max-height:82vh;overflow:auto;border-radius:12px}.modalHead{padding:13px;font-weight:800;border-bottom:1px solid #ddd}.modalBody{padding:13px}.modalFoot{display:flex;gap:8px;padding:12px}.modalFoot button{flex:1;padding:10px;border:0;border-radius:7px;font-weight:800}.cancel{background:#e5e7eb}.create{background:#2563eb;color:#fff}.drawingPanel{position:fixed;inset:0;background:#0008;z-index:45;display:none;align-items:center;justify-content:center;padding:14px}.drawingCard{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:14px}.drawingHead{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid #ddd}.drawingHead h2{font-size:17px;margin:0;flex:1}.drawingBody{padding:14px}.uploadBox{border:2px dashed #94a3b8;border-radius:12px;padding:18px;text-align:center;background:#f8fafc}.uploadBox input{width:100%;font-size:16px}.analyzeBtn{margin-top:10px;width:100%;border:0;border-radius:8px;background:#7c3aed;color:#fff;padding:12px;font-weight:800}.analysisGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.analysisCard{border:1px solid #d1d5db;border-radius:9px;padding:10px}.analysisCard h4{margin:0 0 7px;font-size:12px;color:#475569}.dimRow{font-size:12px;padding:5px 0;border-bottom:1px solid #eee}.bad{background:#fef2f2;color:#991b1b;border-radius:7px;padding:8px;margin:5px 0;font-size:12px}.warn{background:#fffbeb;color:#92400e;border-radius:7px;padding:8px;margin:5px 0;font-size:12px}.good{background:#f0fdf4;color:#166534;border-radius:7px;padding:8px;margin:5px 0;font-size:12px}.drawingActions{display:flex;gap:8px;margin-top:12px}.drawingActions button{flex:1;border:0;border-radius:8px;padding:11px;font-weight:800}.useDrawing{background:#15803d;color:white}.closeDrawing{background:#e5e7eb}.useDrawing:disabled{background:#94a3b8}.confidence{font-size:22px;font-weight:800}@media(max-width:620px){.analysisGrid{grid-template-columns:1fr}.drawingCard{max-height:94vh;border-radius:12px}.drawingPanel{padding:8px}}

</div><div class="status"><span id="status">Hazır</span><span>Birim: mm</span></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script>
const $=id=>document.getElementById(id),val=id=>+$((id)).value;
let state={part_name:'parca',base:{type:'cylinder',diameter:50,length:100},features:[]},selected={kind:'base',index:-1},pendingProposal=null,selectedPick=null;
const names={cylinder:'Silindir',flange:'Flanş',block:'Blok',tube:'Boru',through_hole:'Delik',blind_hole:'Kör Delik',countersink_hole:'Havşa',pocket:'Cep',slot:'Slot',chamfer:'Pah',fillet:'Radyüs',circular_hole_pattern:'Dairesel Dizi',shaft_step:'Kademe'};
const posNames={center:'Merkez',left:'Sol',right:'Sağ',top:'Üst',bottom:'Alt',top_left:'Sol üst',top_right:'Sağ üst',bottom_left:'Sol alt',bottom_right:'Sağ alt'};
const posIcons={top_left:'↖',top:'↑',top_right:'↗',left:'←',center:'●',right:'→',bottom_left:'↙',bottom:'↓',bottom_right:'↘'};
let drawingAnalysis=null;
function openDrawing(){ $('drawingPanel').style.display='flex'; }
function closeDrawing(){ $('drawingPanel').style.display='none'; }
$('drawingBtn').onclick=openDrawing;$('drawingCancel').onclick=closeDrawing;$('drawingCloseX').onclick=closeDrawing;
$('drawingAnalyze').onclick=async()=>{
  const f=$('drawingFile').files[0]; if(!f){alert('Önce teknik resim fotoğrafı veya PDF seç.');return}
  $('drawingStatus').textContent='AI görünüşleri, ölçüleri ve geometrik ilişkileri analiz ediyor…';$('drawingResult').innerHTML='';$('drawingUse').disabled=true;drawingAnalysis=null;
  const fd=new FormData();fd.append('file',f);
  try{
    const r=await fetch('/api/drawing/analyze',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw new Error(j.detail||'Analiz hatası');drawingAnalysis=j;
    const conf=Math.round((j.confidence||0)*100);const dims=(j.dimensions||[]).map(d=>`<div class="dimRow"><b>${d.label||d.kind||'Ölçü'}</b>: ${d.value==null?'okunamadı':d.value+' '+(d.unit||'mm')} <span style="float:right;color:#64748b">${Math.round((d.confidence||0)*100)}%</span></div>`).join('');
    const amb=(j.blocking_ambiguities||[]).map(x=>`<div class="bad">⛔ ${x}</div>`).join('');const warns=(j.warnings||[]).map(x=>`<div class="warn">⚠️ ${x}</div>`).join('');const interp=(j.interpretation||[]).map(x=>`<div class="dimRow">• ${x}</div>`).join('');
    $('drawingResult').innerHTML=`<div class="analysisGrid"><div class="analysisCard"><h4>ANALİZ GÜVENİ</h4><div class="confidence">%${conf}</div><div>${j.drawing_type||'unknown'} · ${j.units||'mm'}</div>${j.can_build?'<div class="good">✓ STEP için yeterli ölçü bulundu.</div>':'<div class="bad">STEP oluşturulmadan önce belirsizlikler çözülmeli.</div>'}</div><div class="analysisCard"><h4>PARÇA</h4><b>${j.part_name||'Parça'}</b>${interp}</div><div class="analysisCard"><h4>OKUNAN ÖLÇÜLER</h4>${dims||'Ölçü listesi yok.'}</div><div class="analysisCard"><h4>KONTROL</h4>${amb||'<div class="good">Bloklayıcı belirsizlik bulunmadı.</div>'}${warns}</div></div>`;
    if(j.stl) load(j.stl,true); $('drawingUse').disabled=!j.can_build || !j.state; $('drawingStatus').textContent=j.can_build?'Analiz tamamlandı. Turuncu 3D önizlemeyi kontrol et.':'Analiz tamamlandı; eksik/belirsiz ölçüler var.';
  }catch(e){$('drawingStatus').textContent='Hata: '+e.message}
};
$('drawingUse').onclick=()=>{if(!drawingAnalysis||!drawingAnalysis.can_build||!drawingAnalysis.state)return;state=drawingAnalysis.state;state.part_name=drawingAnalysis.part_name||state.part_name||'parca';$('docName').value=state.part_name;disposeObj(ghost);ghost=null;renderTree();selected={kind:'base',index:-1};renderBaseProps();preview();closeDrawing();setStatus('Teknik resimden çıkarılan CAD modeli yüklendi. STEP + PDF ile dışa aktarabilirsin.')};

function isMobile(){return matchMedia('(max-width:820px)').matches}function closePanels(){ $('leftPanel').classList.remove('open');$('rightPanel').classList.remove('open')}
$('treeBtn').onclick=()=>{$('leftPanel').classList.add('open');$('rightPanel').classList.remove('open')};$('propBtn').onclick=()=>{$('rightPanel').classList.add('open');$('leftPanel').classList.remove('open')};$('closeTree').onclick=closePanels;$('closeProp').onclick=closePanels;
function renderTree(){let h=`<div class="node ${selected.kind==='base'?'sel':''}" data-base-node>📦 ${names[state.base.type]||state.base.type}</div>`;state.features.forEach((f,i)=>h+=`<div class="node ${selected.kind==='feature'&&selected.index===i?'sel':''}" data-fi="${i}">${i+1}. ${names[f.type]||f.type}</div>`);$('tree').innerHTML=h;$('tree').querySelector('[data-base-node]').onclick=()=>{selected={kind:'base',index:-1};renderTree();renderBaseProps()};document.querySelectorAll('[data-fi]').forEach(n=>n.onclick=()=>{selected={kind:'feature',index:+n.dataset.fi};renderTree();renderFeatureProps(selected.index);if(isMobile())$('rightPanel').classList.add('open')})}
function field(label,id,v){return `<div class="field"><label>${label}</label><input id="${id}" type="number" value="${v}"></div>`}function selectField(label,id,v,opts){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(o=>`<option value="${o[0]}" ${o[0]===v?'selected':''}>${o[1]}</option>`).join('')}</select></div>`}
function renderBaseProps(){let b=state.base,h=`<div class="sectionTitle">TABAN GEOMETRİSİ</div>${selectField('Tip','b_type',b.type,[['cylinder','Silindir'],['flange','Flanş'],['block','Blok'],['tube','Boru']])}`;if(['cylinder','flange'].includes(b.type))h+=field('Çap (mm)','b_d',b.diameter)+(b.type==='flange'?field('Kalınlık (mm)','b_l',b.thickness):field('Uzunluk (mm)','b_l',b.length));if(b.type==='block')h+=field('X','b_x',b.x)+field('Y','b_y',b.y)+field('Z','b_z',b.z);if(b.type==='tube')h+=field('Dış çap','b_od',b.outer_diameter)+field('İç çap','b_id',b.inner_diameter)+field('Uzunluk','b_l',b.length);h+=`<button class="ok" id="baseApply">✓ Uygula</button>`;$('propertyPanel').innerHTML=h;$('baseApply').onclick=async()=>{let t=$('b_type').value,b={type:t};if(['cylinder','flange'].includes(t)){b.diameter=val('b_d');if(t==='flange')b.thickness=val('b_l');else b.length=val('b_l')}if(t==='block')Object.assign(b,{x:val('b_x'),y:val('b_y'),z:val('b_z')});if(t==='tube')Object.assign(b,{outer_diameter:val('b_od'),inner_diameter:val('b_id'),length:val('b_l')});state.base=b;await preview();if(isMobile())closePanels()}}
function placementGrid(current='center'){return `<div class="field"><label>Konum — koordinat girmen gerekmez</label><div class="positionGrid">${Object.keys(posIcons).map(p=>`<button type="button" class="pos ${current===p?'active':''}" data-pos="${p}" title="${posNames[p]}">${posIcons[p]}</button>`).join('')}</div><button type="button" class="pickBtn" id="usePick">🎯 Model üzerinde dokunduğum noktayı kullan</button></div>`}
function currentPlacement(f){return f.placement&&f.placement.mode==='semantic'?f.placement.position:'center'}
function bindPosition(root,f){root.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{root.querySelectorAll('[data-pos]').forEach(x=>x.classList.remove('active'));b.classList.add('active');f._tempPlacement={mode:'semantic',position:b.dataset.pos}});let pb=root.querySelector('#usePick');if(pb)pb.onclick=()=>{if(!selectedPick){setStatus('Önce model üzerinde istediğin noktaya dokun.');return}f._tempPlacement={mode:'point',x:selectedPick.x,y:selectedPick.y};pb.textContent='✓ Modelde seçilen nokta kullanılacak'}}
function renderFeatureProps(i){let f=state.features[i],h=`<div class="sectionTitle">${names[f.type]||f.type}</div>`;let locTypes=['through_hole','blind_hole','countersink_hole','pocket','slot'];if(locTypes.includes(f.type))h+=placementGrid(currentPlacement(f));if(f.type==='through_hole')h+=field('Çap','f_a',f.diameter);if(f.type==='blind_hole')h+=field('Çap','f_a',f.diameter)+field('Derinlik','f_b',f.depth);if(f.type==='countersink_hole')h+=field('Delik çapı','f_a',f.diameter)+field('Havşa çapı','f_b',f.countersink_diameter)+field('Açı','f_c',f.angle||90);if(f.type==='pocket')h+=field('Genişlik','f_a',f.width)+field('Yükseklik','f_b',f.height)+field('Derinlik','f_c',f.depth);if(f.type==='slot')h+=field('Uzunluk','f_a',f.length)+field('Genişlik','f_b',f.width)+field('Derinlik','f_c',f.depth);if(f.type==='chamfer')h+=field('Pah ölçüsü','f_a',f.distance)+selectField('Kenar','f_target',f.target||'top_outer',[['top_outer','Üst dış kenar'],['bottom_outer','Alt dış kenar'],['both_outer','İki dış kenar']]);if(f.type==='fillet')h+=field('Radyüs','f_a',f.radius);if(f.type==='circular_hole_pattern')h+=field('Delik çapı','f_a',f.hole_diameter)+field('Adet','f_b',f.quantity)+field('PCD','f_c',f.pcd);if(f.type==='shaft_step')h+=field('Yeni çap','f_a',f.diameter)+field('Kademe boyu','f_b',f.length);h+=`<button class="ok" id="featureApply">✓ Uygula</button><button class="danger" id="featureDelete">Sil</button>`;$('propertyPanel').innerHTML=h;if(locTypes.includes(f.type))bindPosition($('propertyPanel'),f);$('featureApply').onclick=async()=>{if(f._tempPlacement){f.placement=f._tempPlacement;delete f._tempPlacement}if(f.type==='through_hole')f.diameter=val('f_a');if(f.type==='blind_hole')Object.assign(f,{diameter:val('f_a'),depth:val('f_b')});if(f.type==='countersink_hole')Object.assign(f,{diameter:val('f_a'),countersink_diameter:val('f_b'),angle:val('f_c')});if(f.type==='pocket')Object.assign(f,{width:val('f_a'),height:val('f_b'),depth:val('f_c')});if(f.type==='slot')Object.assign(f,{length:val('f_a'),width:val('f_b'),depth:val('f_c')});if(f.type==='chamfer')Object.assign(f,{distance:val('f_a'),target:$('f_target').value});if(f.type==='fillet')f.radius=val('f_a');if(f.type==='circular_hole_pattern')Object.assign(f,{hole_diameter:val('f_a'),quantity:val('f_b'),pcd:val('f_c')});if(f.type==='shaft_step')Object.assign(f,{diameter:val('f_a'),length:val('f_b')});state.features[i]=f;await preview();renderTree();if(isMobile())closePanels()};$('featureDelete').onclick=async()=>{state.features.splice(i,1);selected={kind:'base',index:-1};renderTree();renderBaseProps();await preview();if(isMobile())closePanels()}}
function openBase(t){state.features=[];if(t==='block')state.base={type:t,x:100,y:60,z:20};if(t==='cylinder')state.base={type:t,diameter:50,length:100};if(t==='flange')state.base={type:t,diameter:100,thickness:20};if(t==='tube')state.base={type:t,outer_diameter:60,inner_diameter:40,length:100};selected={kind:'base',index:-1};renderTree();renderBaseProps();preview()}
document.querySelectorAll('[data-base]').forEach(b=>b.onclick=()=>openBase(b.dataset.base));
function openFeature(t){let f={id:'feature_'+String(state.features.length+1).padStart(3,'0'),type:t,face:'top',placement:{mode:'semantic',position:'center'}};let h='';if(['through_hole','blind_hole','countersink_hole','pocket','slot'].includes(t))h+=placementGrid('center');if(t==='through_hole')h+=field('Çap','m_a',10);if(t==='blind_hole')h+=field('Çap','m_a',10)+field('Derinlik','m_b',10);if(t==='countersink_hole')h+=field('Delik çapı','m_a',8)+field('Havşa çapı','m_b',14)+field('Açı','m_c',90);if(t==='pocket')h+=field('Genişlik','m_a',20)+field('Yükseklik','m_b',20)+field('Derinlik','m_c',5);if(t==='slot')h+=field('Uzunluk','m_a',30)+field('Genişlik','m_b',8)+field('Derinlik','m_c',5);if(t==='chamfer'){f.target='top_outer';h+=field('Pah ölçüsü','m_a',2)+selectField('Kenar','m_target','top_outer',[['top_outer','Üst dış kenar'],['bottom_outer','Alt dış kenar'],['both_outer','İki dış kenar']])}if(t==='fillet')h+=field('Radyüs','m_a',2);if(t==='circular_hole_pattern')h+=field('Delik çapı','m_a',10)+field('Adet','m_b',6)+field('PCD','m_c',80);if(t==='shaft_step')h+=field('Yeni çap','m_a',40)+field('Kademe boyu','m_b',30);$('modalTitle').textContent=names[t]||t;$('modalBody').innerHTML=h;$('modalBg').style.display='flex';if(['through_hole','blind_hole','countersink_hole','pocket','slot'].includes(t))bindPosition($('modalBody'),f);$('modalOk').onclick=async()=>{if(f._tempPlacement){f.placement=f._tempPlacement;delete f._tempPlacement}if(t==='through_hole')f.diameter=val('m_a');if(t==='blind_hole')Object.assign(f,{diameter:val('m_a'),depth:val('m_b')});if(t==='countersink_hole')Object.assign(f,{diameter:val('m_a'),countersink_diameter:val('m_b'),angle:val('m_c')});if(t==='pocket')Object.assign(f,{width:val('m_a'),height:val('m_b'),depth:val('m_c')});if(t==='slot')Object.assign(f,{length:val('m_a'),width:val('m_b'),depth:val('m_c')});if(t==='chamfer')Object.assign(f,{distance:val('m_a'),target:$('m_target').value});if(t==='fillet')f.radius=val('m_a');if(t==='circular_hole_pattern')Object.assign(f,{hole_diameter:val('m_a'),quantity:val('m_b'),pcd:val('m_c')});if(t==='shaft_step')Object.assign(f,{diameter:val('m_a'),length:val('m_b'),position:'right'});state.features.push(f);closeModal();selected={kind:'feature',index:state.features.length-1};renderTree();renderFeatureProps(selected.index);await preview()}}
document.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>openFeature(b.dataset.feature));function closeModal(){$('modalBg').style.display='none'}$('modalCancel').onclick=closeModal;
let scene,camera,renderer,controls,mesh,ghost,loader,raycaster,pointer,pDown,marker,lastSize=100;function initViewer(){let el=$('viewer');scene=new THREE.Scene();scene.background=new THREE.Color(0xe6edf3);camera=new THREE.PerspectiveCamera(40,el.clientWidth/el.clientHeight,.1,10000);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(el.clientWidth,el.clientHeight);el.appendChild(renderer.domElement);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.screenSpacePanning=true;scene.add(new THREE.HemisphereLight(0xffffff,0x94a3b8,1.2));let d=new THREE.DirectionalLight(0xffffff,1);d.position.set(200,250,300);scene.add(d);scene.add(new THREE.GridHelper(400,40,0x9aa7b6,0xcbd5e1));loader=new THREE.STLLoader();raycaster=new THREE.Raycaster();pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>pDown={x:e.clientX,y:e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(!pDown||!mesh)return;let dd=Math.hypot(e.clientX-pDown.x,e.clientY-pDown.y);pDown=null;if(dd<8)pick(e.clientX,e.clientY)});function anim(){requestAnimationFrame(anim);controls.update();renderer.render(scene,camera)}anim();addEventListener('resize',()=>{let w=el.clientWidth,h=el.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)})}
function disposeObj(o){if(o){scene.remove(o);o.geometry.dispose();o.material.dispose()}}function fit(){if(!mesh)return;let b=new THREE.Box3().setFromObject(mesh),s=b.getSize(new THREE.Vector3());lastSize=Math.max(s.x,s.y,s.z)||100;controls.target.set(0,0,0);camera.position.set(lastSize*1.7,-lastSize*1.7,lastSize*1.35);controls.update()}function load(url,asGhost=false){loader.load(url+'?t='+Date.now(),g=>{g.computeVertexNormals();let obj=new THREE.Mesh(g,new THREE.MeshStandardMaterial(asGhost?{color:0xf59e0b,transparent:true,opacity:.45,depthWrite:false}:{color:0x9fb5cc,metalness:.18,roughness:.45,side:THREE.DoubleSide}));let b=new THREE.Box3().setFromObject(obj),c=b.getCenter(new THREE.Vector3());obj.position.sub(c);if(asGhost){disposeObj(ghost);ghost=obj;scene.add(ghost)}else{disposeObj(mesh);mesh=obj;scene.add(mesh);fit()}})}
function dominant(n){let a=[Math.abs(n.x),Math.abs(n.y),Math.abs(n.z)];if(a[2]>=a[0]&&a[2]>=a[1])return n.z>=0?'top':'bottom';if(a[0]>=a[1])return n.x>=0?'right':'left';return n.y>=0?'back':'front'}function pick(cx,cy){let r=renderer.domElement.getBoundingClientRect();pointer.x=((cx-r.left)/r.width)*2-1;pointer.y=-((cy-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);let hit=raycaster.intersectObject(mesh,false)[0];if(!hit)return;let n=hit.face.normal.clone().transformDirection(mesh.matrixWorld),face=dominant(n);if(state.base.type!=='block'&&!['top','bottom'].includes(face)){setStatus('Silindirik parçanın uç yüzeyine dokun.');return}let p=hit.point,x=p.x,y=p.y;if(face==='right'||face==='left'){x=p.y;y=p.z}else if(face==='front'||face==='back'){x=p.x;y=p.z}selectedPick={face,x,y};disposeObj(marker);marker=new THREE.Mesh(new THREE.SphereGeometry(Math.max(1,lastSize*.015),14,10),new THREE.MeshBasicMaterial({color:0xef4444,depthTest:false}));marker.position.copy(p);marker.renderOrder=50;scene.add(marker);$('pickBadge').style.display='block';$('pickBadge').textContent='🎯 Nokta seçildi — artık “buraya delik aç” diyebilirsin.';setStatus('Model üzerinde işlem noktası seçildi.')}
function setView(v){let m=lastSize||100,pos={iso:[m*1.7,-m*1.7,m*1.35],front:[0,-m*2,0],top:[0,0,m*2],right:[m*2,0,0]}[v];camera.position.set(...pos);camera.up.set(0,0,1);controls.target.set(0,0,0);controls.update()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('fitBtn').onclick=fit;
function setStatus(t){$('status').textContent=t}async function preview(){setStatus('Model hesaplanıyor…');let r=await fetch('/api/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state})}),j=await r.json();if(!r.ok){setStatus('Hata: '+j.detail);alert(j.detail);return false}state=j.state;load(j.stl,false);setStatus('Model güncel');return true}
function newestLocFeature(s){for(let i=s.features.length-1;i>=0;i--)if(['through_hole','blind_hole','pocket','slot','countersink_hole','counterbore_hole'].includes(s.features[i].type))return {f:s.features[i],i};return null}
async function propose(){let text=$('command').value.trim();if(!text)return;if(selectedPick&&/(buraya|bu noktaya|seçili|dokunduğum)/i.test(text))text+=` seçili x=${selectedPick.x.toFixed(3)} y=${selectedPick.y.toFixed(3)}`;setStatus('AI komutu yorumluyor…');let r=await fetch('/api/propose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,state})}),j=await r.json();if(!r.ok){alert(j.detail);setStatus('Komut anlaşılamadı');return}pendingProposal=j;load(j.stl,true);$('proposalText').innerHTML=`<ul>${j.summary.map(x=>`<li>${x}</li>`).join('')}</ul>${j.assumptions.map(x=>`<div class="assumption">💡 ${x}</div>`).join('')}`;let loc=newestLocFeature(j.state),ph='';if(loc&&loc.f.placement&&loc.f.placement.mode==='semantic'){ph=Object.keys(posIcons).map(p=>`<button data-proppos="${p}" class="${loc.f.placement.position===p?'active':''}">${posNames[p]}</button>`).join('')}$('proposalPositions').innerHTML=ph;$('proposalPositions').querySelectorAll('[data-proppos]').forEach(b=>b.onclick=async()=>{loc.f.placement={mode:'semantic',position:b.dataset.proppos};$('proposalPositions').querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');let pr=await fetch('/api/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:j.state})}),pj=await pr.json();if(pr.ok)load(pj.stl,true)});$('proposal').style.display='block';setStatus('AI önerisi hazır — 3D turuncu önizlemeyi kontrol et.')}
$('aiBtn').onclick=propose;$('proposalCancel').onclick=()=>{pendingProposal=null;disposeObj(ghost);ghost=null;$('proposal').style.display='none';setStatus('Öneri iptal edildi')};$('proposalApply').onclick=()=>{if(!pendingProposal)return;state=pendingProposal.state;pendingProposal=null;disposeObj(ghost);ghost=null;$('proposal').style.display='none';renderTree();selected={kind:'feature',index:state.features.length-1};if(selected.index>=0)renderFeatureProps(selected.index);preview();$('command').value='';setStatus('AI önerisi uygulandı')};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){let rec=new SR();rec.lang='tr-TR';rec.interimResults=false;rec.onstart=()=>setStatus('🎤 Dinliyorum…');rec.onresult=e=>{$('command').value=e.results[0][0].transcript;setStatus('Ses alındı — AI Analiz Et')};rec.onerror=e=>setStatus('Ses hatası: '+e.error);$('mic').onclick=()=>rec.start()}else $('mic').onclick=()=>alert('Bu Safari sürümünde konuşma tanıma yok; komutu yazabilirsin.');
$('docName').onchange=()=>state.part_name=$('docName').value||'parca';$('buildBtn').onclick=async()=>{setStatus('STEP ve PDF hazırlanıyor…');let r=await fetch('/api/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state})}),j=await r.json();if(!r.ok){alert(j.detail);return}let base=location.origin,msg=encodeURIComponent(`CAD modeli hazırlandı\nSTEP: ${base+j.step}\nPDF: ${base+j.pdf}`);let w=window.open('','_blank');if(w)w.document.write(`<meta name="viewport" content="width=device-width"><style>body{font-family:Arial;padding:24px}a{display:block;margin:10px;padding:14px;background:#1d4ed8;color:white;border-radius:8px;text-decoration:none}</style><h2>${state.part_name}</h2><a href="${j.step}">STEP indir</a><a href="${j.pdf}">Teknik resim PDF</a><a href="https://wa.me/?text=${msg}">WhatsApp'ta paylaş</a>`);setStatus('Dosyalar hazır')};
renderTree();renderBaseProps();try{initViewer();preview()}catch(e){console.error(e);setStatus('3D görüntüleyici başlatılamadı')}
</script></body></html>
