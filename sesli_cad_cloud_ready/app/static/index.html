<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Sesli CAD</title><link rel="manifest" href="/manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:940px;margin:auto;padding:18px}.hero{background:#111827;color:white;border-radius:22px;padding:22px}.hero h1{margin:0 0 6px}.card{background:white;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 4px 18px #0001}.tabs{display:flex;gap:8px}.tab{flex:1;padding:12px;border:0;border-radius:12px;font-weight:700}.active{background:#111827;color:#fff}.mic{width:92px;height:92px;border-radius:50%;font-size:34px;border:0;background:#111827;color:white}.row{display:flex;gap:10px;flex-wrap:wrap}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px}label{display:block;font-size:13px;font-weight:700;margin:8px 0 5px}.btn{padding:12px 16px;border-radius:11px;border:0;font-weight:700;background:#111827;color:white}.btn2{background:#e5e7eb;color:#111827}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.feature{padding:9px;background:#f9fafb;border-radius:10px;margin:6px 0;font-size:13px}.links a{display:inline-block;padding:10px 12px;background:#111827;color:#fff;border-radius:10px;text-decoration:none;margin:4px}.status{font-size:13px;color:#4b5563}.preview{width:100%;height:420px;border:0;border-radius:12px;background:#f9fafb}@media(max-width:600px){.grid{grid-template-columns:1fr}.preview{height:320px}.wrap{padding:10px}.hero{border-radius:16px}}
</style></head><body><div class="wrap"><div class="hero"><h1>Sesli CAD</h1><div>Türkçe konuş veya ölçüleri gir → STEP + teknik resim PDF</div></div>
<div class="card"><div class="tabs"><button id="voiceTab" class="tab active">🎤 Sesli</button><button id="manualTab" class="tab">⌨️ Manuel</button></div>
<div id="voicePane" style="text-align:center;padding-top:16px"><button id="mic" class="mic">🎤</button><p id="voiceStatus" class="status">Mikrofona bas ve parçayı tarif et.</p><textarea id="command" rows="4" placeholder="Örn: 100 çapında 20 kalınlığında flanş yap, ortasına 40 delik aç, 80 PCD üzerinde 6 tane 10'luk delik aç, 2 mm pah ver."></textarea><button id="parseBtn" class="btn" style="margin-top:10px">Komutu yorumla</button></div>
<div id="manualPane" style="display:none"><div class="grid"><div><label>Parça tipi</label><select id="baseType"><option value="cylinder">Mil / Silindir</option><option value="flange">Flanş</option><option value="block">Blok</option><option value="tube">Boru</option></select></div><div><label>Parça adı</label><input id="partName" value="parca"></div></div><div id="fields" class="grid"></div><button id="manualApply" class="btn">Tabanı oluştur</button></div></div>
<div class="card"><h3>Model planı</h3><pre id="summary" style="white-space:pre-wrap">Henüz model yok.</pre><div id="features"></div><div class="row"><select id="featureType" style="max-width:210px"><option value="through_hole">Delik</option><option value="blind_hole">Kör delik</option><option value="circular_hole_pattern">PCD delikleri</option><option value="chamfer">Pah</option><option value="fillet">Radyüs</option><option value="shaft_step">Kademe</option><option value="keyway">Kama kanalı</option><option value="pocket">Cep</option><option value="internal_thread">İç diş (notasyon)</option></select><button class="btn2 btn" id="addFeature">+ İşlem ekle</button></div><div id="featureForm"></div><button id="buildBtn" class="btn" style="margin-top:12px">STEP + PDF oluştur</button><p id="buildStatus" class="status"></p></div>
<div class="card"><h3>Çıktılar</h3><div id="links" class="links">Henüz çıktı yok.</div></div></div>
<script>
let state={part_name:'parca',base:{type:'cylinder',diameter:50,length:100},features:[]};
const $=id=>document.getElementById(id);
function render(){ $('summary').textContent=JSON.stringify(state,null,2); $('features').innerHTML=state.features.map((f,i)=>`<div class="feature">${i+1}. <b>${f.type}</b> ${Object.entries(f).filter(([k])=>!['id','type'].includes(k)).map(([k,v])=>`${k}: ${v}`).join(' · ')} <button onclick="removeF(${i})">Sil</button></div>`).join(''); }
function removeF(i){state.features.splice(i,1);render()}
function fieldHtml(){let t=$('baseType').value;let h=''; if(t==='cylinder')h='<div><label>Çap (mm)</label><input id="d" type="number" value="50"></div><div><label>Uzunluk (mm)</label><input id="l" type="number" value="100"></div>'; if(t==='flange')h='<div><label>Dış çap (mm)</label><input id="d" type="number" value="100"></div><div><label>Kalınlık (mm)</label><input id="l" type="number" value="20"></div>'; if(t==='block')h='<div><label>X</label><input id="x" type="number" value="100"></div><div><label>Y</label><input id="y" type="number" value="60"></div><div><label>Z</label><input id="z" type="number" value="20"></div>'; if(t==='tube')h='<div><label>Dış çap</label><input id="od" type="number" value="60"></div><div><label>İç çap</label><input id="id" type="number" value="40"></div><div><label>Uzunluk</label><input id="l" type="number" value="100"></div>'; $('fields').innerHTML=h}
$('baseType').onchange=fieldHtml;fieldHtml();
$('voiceTab').onclick=()=>{$('voicePane').style.display='block';$('manualPane').style.display='none';$('voiceTab').classList.add('active');$('manualTab').classList.remove('active')};
$('manualTab').onclick=()=>{$('voicePane').style.display='none';$('manualPane').style.display='block';$('manualTab').classList.add('active');$('voiceTab').classList.remove('active')};
$('manualApply').onclick=()=>{let t=$('baseType').value;state.part_name=$('partName').value||'parca'; if(t==='cylinder')state.base={type:t,diameter:+$('d').value,length:+$('l').value};if(t==='flange')state.base={type:t,diameter:+$('d').value,thickness:+$('l').value};if(t==='block')state.base={type:t,x:+$('x').value,y:+$('y').value,z:+$('z').value};if(t==='tube')state.base={type:t,outer_diameter:+$('od').value,inner_diameter:+$('id').value,length:+$('l').value};render()};
$('parseBtn').onclick=async()=>{let r=await fetch('/api/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('command').value,state})});let j=await r.json();if(!r.ok)return alert(j.detail);state=j.state;render()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){let rec=new SR();rec.lang='tr-TR';rec.interimResults=false;rec.onstart=()=>$('voiceStatus').textContent='Dinliyorum...';rec.onresult=e=>{$('command').value=e.results[0][0].transcript;$('voiceStatus').textContent='Komut alındı.'};rec.onerror=e=>$('voiceStatus').textContent='Ses hatası: '+e.error;rec.onend=()=>{};$('mic').onclick=()=>rec.start()}else{$('mic').onclick=()=>alert('Bu tarayıcı doğrudan konuşma tanımayı desteklemiyor. Metin alanına komutu yazabilirsin. iPhone Safari sürümüne göre destek değişebilir.')}
$('addFeature').onclick=()=>{let t=$('featureType').value, h='<div class="grid">';let F=(id,label,val)=>`<div><label>${label}</label><input id="${id}" type="number" value="${val}"></div>`;if(t==='through_hole')h+=F('a','Çap',10)+F('x1','X',0)+F('y1','Y',0);if(t==='blind_hole')h+=F('a','Çap',10)+F('b','Derinlik',10);if(t==='circular_hole_pattern')h+=F('a','Delik çapı',10)+F('b','Adet',6)+F('c','PCD',80);if(t==='chamfer')h+=F('a','Pah',2);if(t==='fillet')h+=F('a','Radyüs',2);if(t==='shaft_step')h+=F('a','Yeni çap',40)+F('b','Kademe boyu',30);if(t==='keyway')h+=F('a','Genişlik',12)+F('b','Derinlik',4);if(t==='pocket')h+=F('a','Genişlik',20)+F('b','Yükseklik',20)+F('c','Derinlik',5);if(t==='internal_thread')h+=F('a','M ölçüsü',8)+F('b','Hatve',1.25);h+='</div><button class="btn" id="saveFeature">Ekle</button>';$('featureForm').innerHTML=h;$('saveFeature').onclick=()=>{let f={id:'feature_'+String(state.features.length+1).padStart(3,'0'),type:t};if(t==='through_hole')Object.assign(f,{diameter:+$('a').value,x:+$('x1').value,y:+$('y1').value});if(t==='blind_hole')Object.assign(f,{diameter:+$('a').value,depth:+$('b').value});if(t==='circular_hole_pattern')Object.assign(f,{hole_diameter:+$('a').value,quantity:+$('b').value,pcd:+$('c').value});if(t==='chamfer')Object.assign(f,{distance:+$('a').value,selector:'%Circle'});if(t==='fillet')Object.assign(f,{radius:+$('a').value,selector:'|Z'});if(t==='shaft_step')Object.assign(f,{diameter:+$('a').value,length:+$('b').value});if(t==='keyway')Object.assign(f,{width:+$('a').value,depth:+$('b').value});if(t==='pocket')Object.assign(f,{width:+$('a').value,height:+$('b').value,depth:+$('c').value});if(t==='internal_thread')Object.assign(f,{size:'M'+$('a').value,pitch:+$('b').value});state.features.push(f);$('featureForm').innerHTML='';render()}}
$('buildBtn').onclick=async()=>{$('buildStatus').textContent='Oluşturuluyor...';let r=await fetch('/api/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state})});let j=await r.json();if(!r.ok){$('buildStatus').textContent='Hata: '+j.detail;return} $('buildStatus').textContent='Hazır.';let base=location.origin;let msg=encodeURIComponent(`CAD modeli hazırlandı\nSTEP: ${base+j.step}\nTeknik Resim PDF: ${base+j.pdf}`);$('links').innerHTML=`<a href="${j.step}">STEP indir</a><a href="${j.pdf}">PDF indir</a><a href="https://wa.me/?text=${msg}" target="_blank">WhatsApp'ta paylaş</a>`};
render();
</script></body></html>
