display:flex;gap:6px;position:sticky;bottom:0;background:#f8fafc;padding-top:8px}.apply{flex:1;border:0;border-radius:5px;padding:9px;font-weight:750}.ok{background:#15803d;color:#fff}.cancel{background:#e2e8f0}.danger{background:#fee2e2;color:#b91c1c}.statusbar{background:#f8fafc;border-top:1px solid #94a3b8;display:flex;align-items:center;gap:15px;padding:0 10px;font-size:11px;color:#475569}.statusbar .spacer{flex:1}.drawerBtn{display:none}.empty{padding:14px;color:#64748b;font-size:12px;line-height:1.45}.modalBackdrop{position:fixed;inset:0;background:#0005;z-index:20;display:none;align-items:center;justify-content:center}.modal{background:#fff;border-radius:9px;box-shadow:0 15px 50px #0005;width:min(390px,calc(100% - 30px));max-height:80vh;overflow:auto}.modal h3{margin:0;padding:13px 15px;background:#e2e8f0;border-bottom:1px solid #cbd5e1}.modalbody{padding:13px}.modalactions{display:flex;gap:7px;padding:12px;border-top:1px solid #e5e7eb}.modalactions button{flex:1;padding:9px;border-radius:5px;border:0;font-weight:750}.primary{background:#1e40af;color:#fff}.secondary{background:#e2e8f0}.toast{position:fixed;left:50%;top:115px;transform:translateX(-50%);z-index:50;background:#111827;color:#fff;padding:9px 14px;border-radius:6px;font-size:12px;display:none;max-width:85vw}.mobiletabs{display:none}

<body><div class="app">
<header class="topbar"><div class="brand">VoiceCAD Studio</div><input id="docName" class="docname" value="parca"><div class="topspacer"></div><button class="topbtn drawerBtn" id="treeBtn">☰ Ağaç</button><button class="topbtn drawerBtn" id="propBtn">⚙ Özellik</button><button class="topbtn hideM" id="newBtn">Yeni</button><button class="topbtn" id="buildBtn">STEP + PDF</button></header>
<nav class="ribbon">
 <div class="toolgroup"><button class="tool" data-newbase="block"><span class="ico">▰</span>Blok</button><button class="tool" data-newbase="cylinder"><span class="ico">◉</span>Silindir</button><button class="tool" data-newbase="flange"><span class="ico">◎</span>Flanş</button><button class="tool" data-newbase="tube"><span class="ico">◌</span>Boru</button></div>

 <div class="toolgroup"><button class="tool" data-feature="pocket"><span class="ico">▣</span>Cep</button><button class="tool" data-feature="slot"><span class="ico">▱</span>Slot</button><button class="tool" data-feature="keyway"><span class="ico">▥</span>Kama</button><button class="tool" data-feature="shaft_step"><span class="ico">⌐</span>Kademe</button></div>

<div class="modalBackdrop" id="modalBackdrop"><div class="modal"><h3 id="modalTitle">Yeni Feature</h3><div class="modalbody" id="modalBody"></div><div class="modalactions"><button class="secondary" id="modalCancel">İptal</button><button class="primary" id="modalOk">Uygula</button></div></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script>
let state={part_name:'parca',base:{type:'cylinder',diameter:50,length:100},features:[]};
let selectedPick=null; // {face,x,y,point}; model üzerinde dokunulan konum
const faceTR={top:'üst',bottom:'alt',right:'sağ',left:'sol',front:'ön',back:'arka'}; let selected={kind:'base',index:-1};
const $=id=>document.getElementById(id); const val=id=>+$((id)).value; function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
const names={cylinder:'Silindir',flange:'Flanş',block:'Blok',tube:'Boru',through_hole:'Delik',blind_hole:'Kör Delik',countersink_hole:'Konik Havşa',counterbore_hole:'Silindirik Havşa',circular_hole_pattern:'Dairesel Delik Dizisi',linear_hole_pattern:'Doğrusal Delik Dizisi',slot:'Slot',pocket:'Cep',keyway:'Kama Kanalı',chamfer:'Pah',fillet:'Radyüs',shaft_step:'Kademe',internal_thread:'İç Diş',external_thread:'Dış Diş'};
function renderTree(){let h=`<div class="treeitem ${selected.kind==='base'?'sel':''}" onclick="selectBase()"><span>📦</span><b>${names[state.base.type]||'Gövde'}</b><span class="eye">◉</span></div>`;state.features.forEach((f,i)=>{h+=`<div class="treeitem ${selected.kind==='feature'&&selected.index===i?'sel':''}" onclick="selectFeature(${i})" style="padding-left:22px"><span>↳</span><span>${names[f.type]||f.type}</span><span class="eye">✓</span></div>`});$('tree').innerHTML=h;$('featCount').textContent=(state.features.length+1)+' feature';$('docName').value=state.part_name}
window.selectBase=()=>{selected={kind:'base',index:-1};renderTree();renderBaseProps()}; window.selectFeature=i=>{selected={kind:'feature',index:i};renderTree();renderFeatureProps(i)};
function ffield(label,id,v,type='number'){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${v??''}"></div>`} function sfield(label,id,v,opts){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${x[1]}</option>`).join('')}</select></div>`}
function renderBaseProps(){let b=state.base,h='<div class="section"><div class="sectiontitle">Taban Geometrisi</div>'+sfield('Tip','p_type',b.type,[['cylinder','Silindir'],['flange','Flanş'],['block','Blok'],['tube','Boru']]);if(b.type==='cylinder')h+=ffield('Çap (mm)','p_d',b.diameter)+ffield('Uzunluk (mm)','p_l',b.length);if(b.type==='flange')h+=ffield('Dış çap (mm)','p_d',b.diameter)+ffield('Kalınlık (mm)','p_l',b.thickness);if(b.type==='block')h+='<div class="twocol">'+ffield('X','p_x',b.x)+ffield('Y','p_y',b.y)+'</div>'+ffield('Z','p_z',b.z);if(b.type==='tube')h+=ffield('Dış çap','p_od',b.outer_diameter)+ffield('İç çap','p_id',b.inner_diameter)+ffield('Uzunluk','p_l',b.length);h+='</div><div class="applyrow"><button class="apply ok" onclick="applyBaseProps()">✓ Uygula</button></div>';$('propertyPanel').innerHTML=h}
window.applyBaseProps=async()=>{let t=$('p_type').value,b={type:t};if(t==='cylinder')Object.assign(b,{diameter:val('p_d'),length:val('p_l')});if(t==='flange')Object.assign(b,{diameter:val('p_d'),thickness:val('p_l')});if(t==='block')Object.assign(b,{x:val('p_x'),y:val('p_y'),z:val('p_z')});if(t==='tube')Object.assign(b,{outer_diameter:val('p_od'),inner_diameter:val('p_id'),length:val('p_l')});state.base=b;state.part_name=$('docName').value||'parca';renderTree();await previewOnly()};
const faceOpts=[['top','Üst'],['bottom','Alt'],['right','Sağ'],['left','Sol'],['front','Ön'],['back','Arka']];
function commonPosition(f){return sfield('Yüzey','p_face',f.face||'top',faceOpts)+'<div class="twocol">'+ffield('X konumu','p_x',f.x||0)+ffield('Y konumu','p_y',f.y||0)+'</div>'}
function renderFeatureProps(i){let f=state.features[i],h=`<div class="section"><div class="sectiontitle">${names[f.type]||f.type}</div>`;if(['through_hole','blind_hole','countersink_hole','counterbore_hole','linear_hole_pattern','slot','pocket','keyway','internal_thread'].includes(f.type))h+=commonPosition(f);if(f.type==='through_hole')h+=ffield('Çap','p_a',f.diameter);if(f.type==='blind_hole')h+=ffield('Çap','p_a',f.diameter)+ffield('Derinlik','p_b',f.depth);if(f.type==='countersink_hole')h+=ffield('Delik çapı','p_a',f.diameter)+ffield('Havşa çapı','p_b',f.countersink_diameter)+ffield('Açı','p_c',f.angle);if(f.type==='counterbore_hole')h+=ffield('Delik çapı','p_a',f.diameter)+ffield('Havşa çapı','p_b',f.counterbore_diameter)+ffield('Havşa derinliği','p_c',f.counterbore_depth);if(f.type==='circular_hole_pattern')h+=sfield('Yüzey','p_face',f.face||'top',faceOpts)+ffield('Delik çapı','p_a',f.hole_diameter)+ffield('Adet','p_b',f.quantity)+ffield('PCD','p_c',f.pcd);if(f.type==='linear_hole_pattern')h+=ffield('Delik çapı','p_a',f.hole_diameter)+ffield('Adet','p_b',f.quantity)+ffield('Aralık','p_c',f.spacing)+sfield('Dizi yönü','p_axis',f.axis||'x',[['x','X'],['y','Y']]);if(f.type==='slot')h+=ffield('Uzunluk','p_a',f.length)+ffield('Genişlik','p_b',f.width)+ffield('Derinlik','p_c',f.depth)+ffield('Açı','p_ang',f.angle||0);if(f.type==='pocket')h+=ffield('Genişlik','p_a',f.width)+ffield('Yükseklik','p_b',f.height)+ffield('Derinlik','p_c',f.depth);if(f.type==='keyway')h+=ffield('Genişlik','p_a',f.width)+ffield('Derinlik','p_b',f.depth)+ffield('Uzunluk','p_c',f.length);if(f.type==='chamfer')h+=ffield('Pah','p_a',f.distance);if(f.type==='fillet')h+=ffield('Radyüs','p_a',f.radius);if(f.type==='shaft_step')h+=ffield('Yeni çap','p_a',f.diameter)+ffield('Kademe boyu','p_b',f.length)+sfield('Konum','p_pos',f.position||'right',[['right','Sağ uç'],['left','Sol uç']]);if(f.type==='internal_thread'||f.type==='external_thread')h+=ffield('Diş ölçüsü (M)','p_a',String(f.size||'M8').replace('M',''))+ffield('Hatve','p_b',f.pitch||1.25);h+='</div><div class="applyrow"><button class="apply danger" onclick="deleteSelected()">Sil</button><button class="apply ok" onclick="applyFeatureProps()">✓ Uygula</button></div>';$('propertyPanel').innerHTML=h}
window.applyFeatureProps=async()=>{let i=selected.index,f=state.features[i],t=f.type;const face=$('p_face')?$('p_face').value:'top',x=$('p_x')?val('p_x'):0,y=$('p_y')?val('p_y'):0;if(t==='through_hole')Object.assign(f,{diameter:val('p_a'),x,y,face});if(t==='blind_hole')Object.assign(f,{diameter:val('p_a'),depth:val('p_b'),x,y,face});if(t==='countersink_hole')Object.assign(f,{diameter:val('p_a'),countersink_diameter:val('p_b'),angle:val('p_c'),x,y,face});if(t==='counterbore_hole')Object.assign(f,{diameter:val('p_a'),counterbore_diameter:val('p_b'),counterbore_depth:val('p_c'),x,y,face});if(t==='circular_hole_pattern')Object.assign(f,{hole_diameter:val('p_a'),quantity:val('p_b'),pcd:val('p_c'),face});if(t==='linear_hole_pattern')Object.assign(f,{hole_diameter:val('p_a'),quantity:val('p_b'),spacing:val('p_c'),x,y,face,axis:$('p_axis').value});if(t==='slot')Object.assign(f,{length:val('p_a'),width:val('p_b'),depth:val('p_c'),angle:val('p_ang'),x,y,face});if(t==='pocket')Object.assign(f,{width:val('p_a'),height:val('p_b'),depth:val('p_c'),x,y,face});if(t==='keyway')Object.assign(f,{width:val('p_a'),depth:val('p_b'),length:val('p_c'),x,y,face});if(t==='chamfer')Object.assign(f,{distance:val('p_a'),selector:'%Circle'});if(t==='fillet')Object.assign(f,{radius:val('p_a'),selector:'|Z'});if(t==='shaft_step')Object.assign(f,{diameter:val('p_a'),length:val('p_b'),position:$('p_pos').value});if(t==='internal_thread'||t==='external_thread')Object.assign(f,{size:'M'+val('p_a'),pitch:val('p_b')});state.features[i]=f;renderTree();await previewOnly()}; window.deleteSelected=async()=>{if(selected.kind!=='feature')return;state.features.splice(selected.index,1);selected={kind:'base',index:-1};renderTree();renderBaseProps();await previewOnly()};
function baseModal(type){selectedPick=null;updatePickBadge();let b={type};if(type==='block')Object.assign(b,{x:100,y:60,z:20});if(type==='cylinder')Object.assign(b,{diameter:50,length:100});if(type==='flange')Object.assign(b,{diameter:100,thickness:20});if(type==='tube')Object.assign(b,{outer_diameter:60,inner_diameter:40,length:100});state.base=b;state.features=[];selected={kind:'base',index:-1};renderTree();renderBaseProps();previewOnly()}
function modalField(label,id,v){return ffield(label,id,v)} function openFeatureModal(t){let h='';const pick=selectedPick||{face:'top',x:0,y:0};const df=pick.face||'top', dx=Number(pick.x||0).toFixed(2), dy=Number(pick.y||0).toFixed(2);if(['through_hole','blind_hole','countersink_hole','counterbore_hole','linear_hole_pattern','slot','pocket','keyway','internal_thread'].includes(t))h+=sfield('Yüzey','m_face',df,faceOpts)+'<div class="twocol">'+modalField('X','m_x',dx)+modalField('Y','m_y',dy)+'</div>';if(t==='through_hole')h+=modalField('Çap','m_a',10);if(t==='blind_hole')h+=modalField('Çap','m_a',10)+modalField('Derinlik','m_b',10);if(t==='countersink_hole')h+=modalField('Delik çapı','m_a',8)+modalField('Havşa çapı','m_b',14)+modalField('Açı','m_c',90);if(t==='counterbore_hole')h+=modalField('Delik çapı','m_a',8)+modalField('Havşa çapı','m_b',14)+modalField('Havşa derinliği','m_c',5);if(t==='circular_hole_pattern')h+=sfield('Yüzey','m_face',df,faceOpts)+modalField('Delik çapı','m_a',10)+modalField('Adet','m_b',6)+modalField('PCD','m_c',80);if(t==='linear_hole_pattern')h+=modalField('Delik çapı','m_a',8)+modalField('Adet','m_b',4)+modalField('Aralık','m_c',20)+sfield('Yön','m_axis','x',[['x','X'],['y','Y']]);if(t==='slot')h+=modalField('Uzunluk','m_a',30)+modalField('Genişlik','m_b',8)+modalField('Derinlik','m_c',5)+modalField('Açı','m_ang',0);if(t==='pocket')h+=modalField('Genişlik','m_a',20)+modalField('Yükseklik','m_b',20)+modalField('Derinlik','m_c',5);if(t==='keyway')h+=modalField('Genişlik','m_a',12)+modalField('Derinlik','m_b',4)+modalField('Uzunluk','m_c',40);if(t==='chamfer')h+=modalField('Pah','m_a',2);if(t==='fillet')h+=modalField('Radyüs','m_a',2);if(t==='shaft_step')h+=modalField('Yeni çap','m_a',40)+modalField('Kademe boyu','m_b',30)+sfield('Konum','m_pos','right',[['right','Sağ uç'],['left','Sol uç']]);if(t==='internal_thread'||t==='external_thread')h+=modalField('M ölçüsü','m_a',8)+modalField('Hatve','m_b',1.25);$('modalTitle').textContent=names[t]||t;$('modalBody').innerHTML=h;$('modalBackdrop').style.display='flex';$('modalOk').onclick=async()=>{let f={id:'feature_'+String(state.features.length+1).padStart(3,'0'),type:t};const face=$('m_face')?$('m_face').value:'top',x=$('m_x')?val('m_x'):0,y=$('m_y')?val('m_y'):0;if(t==='through_hole')Object.assign(f,{diameter:val('m_a'),x,y,face});if(t==='blind_hole')Object.assign(f,{diameter:val('m_a'),depth:val('m_b'),x,y,face});if(t==='countersink_hole')Object.assign(f,{diameter:val('m_a'),countersink_diameter:val('m_b'),angle:val('m_c'),x,y,face});if(t==='counterbore_hole')Object.assign(f,{diameter:val('m_a'),counterbore_diameter:val('m_b'),counterbore_depth:val('m_c'),x,y,face});if(t==='circular_hole_pattern')Object.assign(f,{hole_diameter:val('m_a'),quantity:val('m_b'),pcd:val('m_c'),face});if(t==='linear_hole_pattern')Object.assign(f,{hole_diameter:val('m_a'),quantity:val('m_b'),spacing:val('m_c'),x,y,face,axis:$('m_axis').value});if(t==='slot')Object.assign(f,{length:val('m_a'),width:val('m_b'),depth:val('m_c'),angle:val('m_ang'),x,y,face});if(t==='pocket')Object.assign(f,{width:val('m_a'),height:val('m_b'),depth:val('m_c'),x,y,face});if(t==='keyway')Object.assign(f,{width:val('m_a'),depth:val('m_b'),length:val('m_c'),x,y,face});if(t==='chamfer')Object.assign(f,{distance:val('m_a'),selector:'%Circle'});if(t==='fillet')Object.assign(f,{radius:val('m_a'),selector:'|Z'});if(t==='shaft_step')Object.assign(f,{diameter:val('m_a'),length:val('m_b'),position:$('m_pos').value});if(t==='internal_thread')Object.assign(f,{size:'M'+val('m_a'),pitch:val('m_b'),x,y,face});if(t==='external_thread')Object.assign(f,{size:'M'+val('m_a'),pitch:val('m_b')});state.features.push(f);closeModal();if(selectedPick)toast('İşlem seçili konuma eklendi');selected={kind:'feature',index:state.features.length-1};renderTree();renderFeatureProps(selected.index);await previewOnly()}}
function closeModal(){$('modalBackdrop').style.display='none'} $('modalCancel').onclick=closeModal;document.querySelectorAll('[data-newbase]').forEach(b=>b.onclick=()=>baseModal(b.dataset.newbase));document.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>openFeatureModal(b.dataset.feature));
$('docName').onchange=()=>{state.part_name=$('docName').value||'parca'};$('newBtn').onclick=()=>baseModal('cylinder');
$('treeBtn').onclick=()=>$('leftPanel').classList.add('open');$('closeTree').onclick=()=>$('leftPanel').classList.remove('open');$('propBtn').onclick=()=>$('rightPanel').classList.add('open');$('closeProp').onclick=()=>$('rightPanel').classList.remove('open');
let scene,camera,renderer,controls,mesh,loader,lastBox,raycaster,pointer,pickMarker,pointerDownPos;function initViewer(){const el=$('viewer');scene=new THREE.Scene();scene.background=new THREE.Color(0xe6edf3);camera=new THREE.PerspectiveCamera(38,el.clientWidth/el.clientHeight,.1,10000);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(el.clientWidth,el.clientHeight);el.appendChild(renderer.domElement);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.screenSpacePanning=true;scene.add(new THREE.HemisphereLight(0xffffff,0x94a3b8,1.25));let d=new THREE.DirectionalLight(0xffffff,.9);d.position.set(200,250,300);scene.add(d);scene.add(new THREE.GridHelper(400,40,0x9aa7b6,0xcbd5e1));scene.add(new THREE.AxesHelper(45));loader=new THREE.STLLoader();raycaster=new THREE.Raycaster();pointer=new THREE.Vector2();camera.position.set(160,130,160);
// CAD benzeri nokta/yüz seçimi: kısa dokunuş seçim, sürükleme OrbitControls içindir.
renderer.domElement.addEventListener('pointerdown',e=>{pointerDownPos={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener('pointerup',e=>{if(!mesh||!pointerDownPos)return;let dist=Math.hypot(e.clientX-pointerDownPos.x,e.clientY-pointerDownPos.y);pointerDownPos=null;if(dist>8)return;pickFromScreen(e.clientX,e.clientY)});
function anim(){requestAnimationFrame(anim);controls.update();renderer.render(scene,camera)}anim();addEventListener('resize',()=>{let w=el.clientWidth,h=el.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)})}function updatePickBadge(){let b=$('pickBadge');if(!b)return;if(!selectedPick){b.style.display='none';return}b.style.display='block';b.innerHTML=`<b>${faceTR[selectedPick.face]||selectedPick.face} yüzey</b><br>X ${selectedPick.x.toFixed(2)} · Y ${selectedPick.y.toFixed(2)} mm<br>Araç seç veya “buraya Ø8 delik aç” de.`}
function clearPickMarker(){if(pickMarker){scene.remove(pickMarker);pickMarker.geometry.dispose();pickMarker.material.dispose();pickMarker=null}}
function dominantFace(n){let ax=Math.abs(n.x),ay=Math.abs(n.y),az=Math.abs(n.z);if(az>=ax&&az>=ay)return n.z>=0?'top':'bottom';if(ax>=ay)return n.x>=0?'right':'left';return n.y>=0?'back':'front'}
function localXY(face,p){if(face==='top')return [p.x,p.y];if(face==='bottom')return [p.x,-p.y];if(face==='right')return [p.y,p.z];if(face==='left')return [-p.y,p.z];if(face==='back')return [-p.x,p.z];if(face==='front')return [p.x,p.z];return [p.x,p.y]}
function pickFromScreen(clientX,clientY){let rect=renderer.domElement.getBoundingClientRect();pointer.x=((clientX-rect.left)/rect.width)*2-1;pointer.y=-((clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);let hits=raycaster.intersectObject(mesh,false);if(!hits.length)return;let hit=hits[0],normal=hit.face.normal.clone().transformDirection(mesh.matrixWorld),face=dominantFace(normal);if(state.base.type!=='block'&&!['top','bottom'].includes(face)){toast('Silindirik parçanın yan yüzeyine dokunarak işlem V5’te sınırlandırıldı. Uç yüzeyi seç veya sesle tarif et.');return}let [lx,ly]=localXY(face,hit.point);selectedPick={face,x:lx,y:ly,point:hit.point.clone()};clearPickMarker();let radius=Math.max(1,(lastBox?Math.max(...lastBox.getSize(new THREE.Vector3()).toArray()):100)*.018);pickMarker=new THREE.Mesh(new THREE.SphereGeometry(radius,18,12),new THREE.MeshBasicMaterial({color:0xef4444,depthTest:false}));pickMarker.position.copy(hit.point);pickMarker.renderOrder=99;scene.add(pickMarker);updatePickBadge();$('status').textContent=`Seçildi: ${faceTR[face]} yüzey · X ${lx.toFixed(2)} · Y ${ly.toFixed(2)} mm`;if(innerWidth<=780){$('rightPanel').classList.add('open')}}
function clearMesh(){if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose();mesh=null}}function fit(){if(!mesh)return;let box=new THREE.Box3().setFromObject(mesh),size=box.getSize(new THREE.Vector3()),m=Math.max(size.x,size.y,size.z)||100;controls.target.set(0,0,0);camera.position.set(m*1.8,m*1.35,m*1.8);camera.near=m/100;camera.far=m*100;camera.updateProjectionMatrix();controls.update()}function loadStl(url){clearMesh();clearPickMarker();loader.load(url+'?t='+Date.now(),g=>{g.computeVertexNormals();mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x9aaec5,metalness:.22,roughness:.42,side:THREE.DoubleSide}));let box=new THREE.Box3().setFromObject(mesh),c=box.getCenter(new THREE.Vector3());mesh.position.sub(c);scene.add(mesh);lastBox=new THREE.Box3().setFromObject(mesh);fit();$('status').textContent='Model güncel'},undefined,e=>{$('status').textContent='3D önizleme hatası';console.error(e)})}function setView(v){if(!mesh)return;let box=new THREE.Box3().setFromObject(mesh),s=box.getSize(new THREE.Vector3()),m=Math.max(s.x,s.y,s.z)||100,pos={front:[0,-m*2,0],top:[0,0,m*2],right:[m*2,0,0],iso:[m*1.7,-m*1.7,m*1.4]}[v];camera.position.set(...pos);camera.up.set(0,0,1);controls.target.set(0,0,0);controls.update()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('fitBtn').onclick=fit;
async function previewOnly(){$('status').textContent='Model hesaplanıyor…';let r=await fetch('/api/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state})}),j=await r.json();if(!r.ok){$('status').textContent='Hata: '+j.detail;toast(j.detail);return false}state=j.state;renderTree();loadStl(j.stl);return true}
$('parseBtn').onclick=async()=>{let text=$('command').value.trim();if(!text)return;if(selectedPick && /(?:buraya|bu noktaya|seçili|dokunduğum|işaretli)/i.test(text)){text += ` ${faceTR[selectedPick.face]||'üst'} yüzey x=${selectedPick.x.toFixed(2)} y=${selectedPick.y.toFixed(2)}`;}$('status').textContent='Komut yorumlanıyor…';let r=await fetch('/api/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,state})}),j=await r.json();if(!r.ok){$('status').textContent='Komut hatası';toast(j.detail);return}state=j.state;renderTree();selected={kind:'feature',index:state.features.length-1};if(selected.index>=0)renderFeatureProps(selected.index);else renderBaseProps();await previewOnly();$('command').value='';toast('Komut uygulandı')};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){let rec=new SR();rec.lang='tr-TR';rec.interimResults=false;rec.onstart=()=>$('voiceStatus').textContent='🎤 Dinliyorum…';rec.onresult=e=>{$('command').value=e.results[0][0].transcript;$('voiceStatus').textContent='Ses alındı';};rec.onerror=e=>$('voiceStatus').textContent='Ses: '+e.error;rec.onend=()=>setTimeout(()=>$('voiceStatus').textContent='',1200);$('mic').onclick=()=>rec.start()}else $('mic').onclick=()=>toast('Bu Safari sürümünde doğrudan konuşma tanıma desteklenmiyor. Komutu yazabilirsin.');
